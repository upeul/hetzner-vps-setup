name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python -m pip install ansible-core==2.19.15
          ansible-galaxy collection install -r setup/ansible/requirements.yml
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.11.0
      - name: Validar código e arquivos
        run: make lint
      - name: Verificar segredos no histórico
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.0 detect --source /repo --no-banner
